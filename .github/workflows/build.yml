name: Build Resource Vision for Fabric 1.20.1
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Fabric mod
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: resource-vision-fabric-1.20.1
          path: build/libs/resource-vision-0.2.0.jar
          if-no-files-found: error
